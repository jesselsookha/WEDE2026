<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            font-size: 48px;
        }
        .grid-container { 
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 2fr 1fr 1fr; */
            gap: 20px;
            background-color: #a9a9a9;
            padding: 20px;
        }
        .grid-item { 
            background-color: #ddd;
            padding: 30px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .grid-container { 
                display: grid;
                grid-template-columns: repeat(1, 1fr); 
                gap: 10px;
                padding: 10px;
            }
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <h1>NAME</h1>
    <div class="grid-container">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
    </div>
</body>
</html>
