<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Georgia, serif;
            font-size: 16px;
            line-height: 1.6;

            color: #333;
        }

    <h1>Typography</h1>
    <p>This paragraph is going to be styled</p>

</html>
