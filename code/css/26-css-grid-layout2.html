<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .container {  
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr 1fr;
        gap: 5px 5px;
        grid-auto-flow: row;
        grid-template-areas:
          "header header header header header"
          "content content content content content"
          "content content content content content"
          "footer footer footer footer footer";
      }

      .header {  
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 0px 0px;
        grid-auto-flow: row;
        grid-template-areas:
          "logo comp"
          "logo menu";
        grid-area: header;
      }

      .logo { grid-area: logo; }

      .comp { grid-area: comp; }

      .menu { grid-area: menu; }

      .content {  
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        gap: 0px 0px;
        grid-auto-flow: row;
        grid-template-areas:
          "maincontent maincontent maincontent ads"
          "maincontent maincontent maincontent ads"
          "maincontent maincontent maincontent ads";
        grid-area: content;
      }

      .ads { grid-area: ads; }

      .maincontent { grid-area: maincontent; }

      .footer {  display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr;
        gap: 0px 0px;
        grid-auto-flow: row;
        grid-template-areas:
          "contact social map";
        grid-area: footer;
      }

      .contact { grid-area: contact; }

      .social { grid-area: social; }

      .map { grid-area: map; }
  </style>
</head>
<body>
    <div class="container">
  <div class="header">
    <div class="logo"></div>
    <div class="comp"></div>
    <div class="menu"></div>
  </div>
  <div class="content">
    <div class="ads"></div>
    <div class="maincontent"></div>
  </div>
  <div class="footer">
    <div class="contact"></div>
    <div class="social"></div>
    <div class="map"></div>
  </div>
</div>
</body>
</html>
