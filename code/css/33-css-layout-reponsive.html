<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body{
            margin: 0; 
            padding: 0; 
        }

        .responsive-box {
            width: 100%; 
            padding: 40px;
            background-color: salmon;
            text-align: center;
        }

        @media (max-width: 600px) {
            .responsive-box {
                background-color: teal;
                padding: 80px; 
            }
        }

    </style>
</head>
<body>
    <div class="responsive-box">Resize Me</div>
</body>
</html>
