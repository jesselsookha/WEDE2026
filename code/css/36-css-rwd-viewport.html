<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
        }
        body { 
            font-size: 16px; /* baseline size */ 
        }

        h1 { 
            font-size: 3rem;
        }

        .text { 
            font-size: 1.5rem;  /* 1.5 x parent size */
            margin: 5vh 0;      /* 5% of the viewport height */
            padding: 2vw;       /* 2% of the viewport width */
            background-color: #dfdfdf;
        }
    </style>
</head>
<body>
    <h1>TITLE</h1>
    <div>This text does nothing</div>
    <div class="text">This text uses relative units for spacing and size</div>
</body>
</html>
