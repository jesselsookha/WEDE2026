<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section p {
            font-size: 18px;
            color: teal;
        }
        .nav-menu li {
            display: inline-block;
            margin-right: 10px;
        }
        div.article {
            padding: 20px;
            border: 1px solid #ccc;
        }
        a {
            color:deeppink; 
            text-decoration: none;
        }
        a:hover {
            color: darkred; 
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <section>
        <p>This is a paragraph in the section</p>
    </section>    
    <ul class="nav-menu">
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
    <div class="article">
        <p>This is a paragraph in the article block</p>
    </div>

    <section>
        <a href="#">Click here</a>
        <p>This is a paragraph in the section</p>
    </section>   
    <p> This is an outside paragraph</p> 

    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
    </ul>
</body>
</html>
