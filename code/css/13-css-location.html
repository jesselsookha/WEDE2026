<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3</title>
    <!-- internal CSS -->
    <style>
        p {
            font-size: 18px;
            color: navy;
        }

    <!-- External CSS -->
    <link rel="stylesheet" href="styles/style3.css">
</head>
<body>
    <h1 style="color: red;">TITLE OF WEBPAGE</h1> <!-- inline css -->

    <br>
    <p style="color: green;">This is another paragraph</p>
</body>
</html>
