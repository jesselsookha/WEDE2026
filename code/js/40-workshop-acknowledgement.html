<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Complete</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Registration Complete</h1>

    <table border="0">
        <tr>
            <td class="label">Student Name:</td>
            <td><span id="name"></span></td>
        </tr>
        <tr>
            <td class="label">Student Number:</td>
            <td><span id="student"></span></td>
        </tr>
        <tr>
            <td class="label">Email:</td>
            <td><span id="email"></span></td>
        </tr>
        <tr>
            <td class="label">Workshop:</td>
            <td><span id="workshop"></span></td>
        </tr>
    </table>

    <hr>

    <h2 class="total">Registration Number: <span id="registration"></span></h2>

    <script>
        // ============================================================
        // Step 8 — Read the URL parameters
        // ============================================================
        let params = new URLSearchParams(window.location.search);

        let name         = params.get("name");
        let student      = params.get("student");
        let email        = params.get("email");
        let workshop     = params.get("workshop");
        let registration = params.get("registration");


        // ============================================================
        // Step 9 — Handle a missing name (graceful fallback)
        // ============================================================
        if (name === null) {

            document.getElementById("name").innerHTML =
                "<span class='error'>No registration details supplied.</span>";

        } else {

            document.getElementById("name").textContent = name;

        }


        // ============================================================
        // Step 8 (continued) — Display the remaining values
        // ============================================================
        document.getElementById("student").textContent      = student;
        document.getElementById("email").textContent        = email;
        document.getElementById("workshop").textContent     = workshop;
        document.getElementById("registration").textContent = registration;
    </script>

</body>
</html>
